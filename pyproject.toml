[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spearhead-vda"
description = "Velocity Dispersion Analysis (VDA) of Solar Energetic Particle events with data of Solar Orbiter, STEREO-A, Parker Solar Probe, SOHO, Wind and BepiColombo"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "George Vasalos"},
    {name = "Jan Gieseler"},
]
requires-python = ">=3.11"
keywords = [
    "solar energetic particles",
    "velocity dispersion analysis",
    "release time",
    "path length",
    "heliophysics",
    "space physics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "astropy>=6.1.7",
    "matplotlib>=3.6.3",
    "numpy>=1.24.1",
    "pandas>=1.5.3",
    "pooch>=1.8.0",
    "pyonset>=1.2.2",
    "seppy>=0.5.1",
    "solo-epd-loader>=0.3.7",
    "sunpy[all]>=6.0.4",
]
dynamic = ["version"]

[project.scripts]
spearhead-vda-notebooks = "spearhead.vda.notebooks:main"

[project.optional-dependencies]
notebook = [
    # ipykernel 7.0-7.3 can stop responding to messages (ipython/ipykernel#1529)
    "ipykernel>=7.4",
    "ipywidgets>=8.1.5",
    "jupyter",
]
test = [
    "flake8",
    "nbmake",
    "pytest",
    "pytest-cov",
    "pytest-doctestplus",
    "pytest-mpl",
]

[project.urls]
Repository = "https://github.com/spearhead-he/VDA"
Documentation = "https://github.com/spearhead-he/VDA/tree/main/docs"
Changelog = "https://github.com/spearhead-he/VDA/blob/main/CHANGELOG.md"
Issues = "https://github.com/spearhead-he/VDA/issues"
DOI = "https://doi.org/10.5281/zenodo.14441053"

[tool.pytest.ini_options]
markers = [
    "network: downloads data (deselect with -m \"not network\")",
]

[tool.setuptools.dynamic]
version = {attr = "spearhead.vda.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
# spearhead is a namespace package, shared with other SPEARHEAD tools
namespaces = true
